          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/onenote/sections:
    get:
      tags: [onenote]
      summary: List OneNote sections
      description: |
        Lists sections of one notebook when `notebook` is supplied, otherwise of
        every accessible notebook. `notebook` accepts a display name,
        `"Owner/Notebook"`, a `notebook_key`, or a Graph ID. Also served at
        `/onenote/sections`.
      parameters:
        - name: notebook
          in: query
          required: false
          schema:
            type: string
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: offline
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Section list (the resolved notebook is `null` when unscoped)
          content:
            application/json:
              schema:
                type: object
                required: [notebook, sections]
                properties:
                  notebook:
                    oneOf:
                      - $ref: "#/components/schemas/OnenoteNotebook"
                      - type: "null"
                  sections:
                    type: array
                    items:
                      $ref: "#/components/schemas/OnenoteSection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [onenote]
      summary: Create a OneNote section in a notebook
      description: |
        `notebook` accepts a display name, `"Owner/Notebook"`, a `notebook_key`,
        or a Graph ID. Also served at `POST /onenote/sections`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOnenoteSectionRequest"
      responses:
        "200":
          description: Section created
          content:
            application/json:
              schema:
                type: object
                required: [ok, notebook, section]
                properties:
                  ok:
                    type: boolean
                  notebook:
                    $ref: "#/components/schemas/OnenoteNotebook"
                  section:
                    $ref: "#/components/schemas/OnenoteSection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/onenote/sections/{section_key}/pages:
    parameters:
      - $ref: "#/components/parameters/OnenoteSectionKey"
    get:
      tags: [onenote]
      summary: List pages in a OneNote section
      description: Also served at `GET /onenote/sections/{section_key}/pages`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: offline
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Page list
          content:
            application/json:
              schema:
                type: object
                required: [section, pages]
                properties:
                  section:
                    $ref: "#/components/schemas/OnenoteSection"
                  pages:
                    type: array
                    items:
                      $ref: "#/components/schemas/OnenotePageSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [onenote]
      summary: Create a OneNote page from Markdown
      description: |
        Compiles GitHub-flavored Markdown (tables, `- [ ]` task lists → OneNote
        to-do tags) and optional inline images into a new page. `image_paths` are
        read on the host running `teams serve`. Also served at
        `POST /onenote/sections/{section_key}/pages`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOnenotePageRequest"
      responses:
        "200":
          description: Page created
          content:
            application/json:
              schema:
                type: object
                required: [ok, section, page]
                properties:
                  ok:
                    type: boolean
                  section:
                    $ref: "#/components/schemas/OnenoteSection"
                  page:
                    $ref: "#/components/schemas/OnenotePageSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/onenote/pages/{page_key}:
    parameters:
      - $ref: "#/components/parameters/OnenotePageKey"
    get:
      tags: [onenote]
      summary: Read a OneNote page
      description: |
        Returns the cached summary, raw XHTML, derived Markdown/plain text,
        parsed blocks (with Graph `element_id` values), resources, and the
        primary `div` container ID. `offline` is the only supported query
        parameter; `offline=true` reads strictly from the SQLite cache and
        returns `404` when the page is not cached. Also served at
        `GET /onenote/pages/{page_key}`.
      parameters:
        - name: offline
          in: query
          required: false
          description: Read from the local SQLite cache only.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Page detail
          content:
            application/json:
              schema:
                type: object
                required: [page]
                properties:
                  page:
                    $ref: "#/components/schemas/OnenotePageDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [onenote]
      summary: Update a OneNote page title/body or a single block
      description: |
        At least one of `title` or `markdown` is required; `block_id` requires
        `markdown` and replaces only that block. Also served at
        `PATCH /onenote/pages/{page_key}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchOnenotePageRequest"
      responses:
        "200":
          description: Patch commands applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnenotePageMutationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [onenote]
      summary: Delete a OneNote page
      description: Also served at `DELETE /onenote/pages/{page_key}`.
      responses:
        "200":
          description: Page deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok, page_key, page_id]
                properties:
                  ok:
                    type: boolean
                  page_key:
                    type: string
                  page_id:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/onenote/pages/{page_key}/append:
    parameters:
      - $ref: "#/components/parameters/OnenotePageKey"
    post:
      tags: [onenote]
      summary: Append Markdown/images to a OneNote page
      description: |
        Requires at least one of `markdown` or `image_paths`. Also served at
        `POST /onenote/pages/{page_key}/append`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendOnenotePageRequest"
      responses:
        "200":
          description: Content appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnenotePageAppendResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/onenote/pages/{page_key}/toggle-todo:
    parameters:
      - $ref: "#/components/parameters/OnenotePageKey"
    post:
      tags: [onenote]
      summary: Toggle a OneNote to-do checkbox
      description: |
        Requires at least one of `block_id` (an `element_id`) or `todo_index`
        (zero-based index among the page's to-do blocks); `block_id` wins when
        both are supplied. Also served at
        `POST /onenote/pages/{page_key}/toggle-todo`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleOnenoteTodoRequest"
      responses:
        "200":
          description: To-do toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnenoteTodoToggleResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/onenote/search:
    get:
      tags: [onenote]
      summary: Search cached OneNote pages via SQLite FTS5
      description: |
        Cache-only search (no `offline` parameter). `refresh=true` re-bootstraps
        the OneNote cache before searching. Also served at `/onenote/search`.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: section
          in: query
          required: false
          description: Optional section filter (name, key, ID, or `"Notebook/Section"`).
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 30
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Search hits
          content:
            application/json:
              schema:
                type: object
                required: [hits]
                properties:
                  hits:
                    type: array
                    items:
                      $ref: "#/components/schemas/OnenoteSearchHit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  # Unversioned alias: `src/serve.rs` nests the same OneNote router at both
  # `/v1/onenote` and `/onenote`, so each path item below is the identical twin
  # of its canonical `/v1/onenote` counterpart.
  /onenote/notebooks:
    $ref: "#/paths/~1v1~1onenote~1notebooks"
  /onenote/sections:
    $ref: "#/paths/~1v1~1onenote~1sections"
  /onenote/sections/{section_key}/pages:
    $ref: "#/paths/~1v1~1onenote~1sections~1{section_key}~1pages"
  /onenote/pages/{page_key}:
    $ref: "#/paths/~1v1~1onenote~1pages~1{page_key}"
  /onenote/pages/{page_key}/append:
    $ref: "#/paths/~1v1~1onenote~1pages~1{page_key}~1append"
  /onenote/pages/{page_key}/toggle-todo:
    $ref: "#/paths/~1v1~1onenote~1pages~1{page_key}~1toggle-todo"
  /onenote/search:
    $ref: "#/paths/~1v1~1onenote~1search"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Required when `teams serve --token <secret>` is set.
  parameters:
    ConversationKey:
      name: key
      in: path
      required: true
      description: URL-encoded `conv_key`, raw `chat_id`, `"Team/Channel"`, or fuzzy conversation title.
      schema:
        type: string
    MessageId:
      name: msg_id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 50
    OnenoteSectionKey:
      name: section_key
      in: path
      required: true
      description: |
        OneNote section key `<scope_key>|<graph_id>` (for example `me|2-def` or
        `group:{gid}|2-def`). Percent-encoded (`%7C` → `|`, `%3A` → `:`); raw
        Graph IDs and section names also resolve.
      schema:
        type: string
    OnenotePageKey:
      name: page_key
      in: path
      required: true
      description: |
        OneNote page key `<scope_key>|<graph_id>` (for example `me|3-ghi`) or a
        raw Graph page ID. Percent-encoded; page titles are also accepted where
        the handler resolves a name.
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid parameters or malformed JSON body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Target conversation or cached thread not found
      content:
