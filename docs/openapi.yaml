    AppendOnenotePageRequest:
      type: object
      description: At least one of `markdown` or `image_paths` is required.
      properties:
        markdown:
          type: string
          description: Markdown to append. The server also accepts the key `markdown_body`.
        image_paths:
          type: array
          items:
            type: string
    ToggleOnenoteTodoRequest:
      type: object
      description: At least one of `block_id` or `todo_index` is required; `block_id` wins when both are supplied.
      properties:
        block_id:
          type: [string, "null"]
        todo_index:
          type: [integer, "null"]
          minimum: 0
    OnenotePageMutationResult:
      type: object
      required: [ok, page_key, page_id, commands_applied, page]
      properties:
        ok:
          type: boolean
        page_key:
          type: string
        page_id:
          type: string
        commands_applied:
          type: integer
        page:
          oneOf:
            - $ref: "#/components/schemas/OnenotePageDetail"
            - type: "null"
    OnenotePageAppendResult:
      type: object
      required: [ok, page_key, page_id, page]
      properties:
        ok:
          type: boolean
        page_key:
          type: string
        page_id:
          type: string
        primary_div_id:
          type: [string, "null"]
        page:
          oneOf:
            - $ref: "#/components/schemas/OnenotePageDetail"
            - type: "null"
    OnenoteTodoToggleResult:
      type: object
      required: [ok, page_key, page_id, completed, command, page]
      properties:
        ok:
          type: boolean
        page_key:
          type: string
        page_id:
          type: string
        element_id:
          type: [string, "null"]
        completed:
          type: boolean
        command:
          type: object
          required: [target, action, content]
          description: OneNote PATCH command actually sent to Graph.
          properties:
            target:
              type: string
            action:
              type: string
            position:
              type: [string, "null"]
            content:
              type: string
        page:
          oneOf:
            - $ref: "#/components/schemas/OnenotePageDetail"
            - type: "null"
