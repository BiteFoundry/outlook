openapi: 3.1.0
info:
  title: teams / outlook / onenote HTTP JSON API
  version: 0.5.0
  description: |
    Local HTTP/JSON contract exposed by `teams serve`, `outlook serve`, or
    `onenote serve` (alias `api`).

    Backed by Microsoft Graph v1.0, local SQLite WAL/FTS5 caching, and the
    background sync engine. Binds to `127.0.0.1:8788` by default. When started
    with `--token`, every endpoint except `GET /health` requires
    `Authorization: Bearer <token>`.

    Microsoft OneNote endpoints are mounted at both `/v1/onenote/*` (canonical)
    and `/onenote/*` (alias); the alias path items below reference their
    canonical twins.

    All errors return `{"error": "<message>"}` with an appropriate HTTP status.
servers:
  - url: http://127.0.0.1:8788
    description: Default loopback listener
security:
  - bearerAuth: []
  - {}
tags:
  - name: health
  - name: conversations
  - name: teams
  - name: messages
  - name: threads
  - name: files
  - name: search
  - name: presence
  - name: mail
  - name: calendar
  - name: contacts
  - name: todo
  - name: onenote
paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe
      description: Always public, even when `--token` is set.
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /conversations:
    get:
      tags: [conversations]
      summary: List cached chats and channels
      parameters:
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [oneOnOne, group, meeting, channel]
      responses:
        "200":
          description: Conversation list
          content:
            application/json:
              schema:
                type: object
                required: [conversations]
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConversationSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /chats:
    post:
      tags: [conversations]
      summary: Create a 1:1 or group chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatRequest"
      responses:
        "200":
          description: Chat created
          content:
            application/json:
              schema:
                type: object
                required: [ok, conversation]
                properties:
                  ok:
                    type: boolean
                  conversation:
                    $ref: "#/components/schemas/ConversationSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /teams:
    get:
      tags: [teams]
      summary: List joined Teams and their channels
      parameters:
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Teams list
          content:
            application/json:
              schema:
                type: object
                required: [teams]
                properties:
                  teams:
                    type: array
                    items:
                      $ref: "#/components/schemas/TeamSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /conversations/{key}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationKey"
    get:
      tags: [messages]
      summary: Read recent messages from a chat or channel
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: offline
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Messages in chronological order
          content:
            application/json:
              schema:
                type: object
                required: [conversation, messages]
                properties:
                  conversation:
                    $ref: "#/components/schemas/ConversationSummary"
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/MessageItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [messages]
      summary: Send a Markdown message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /conversations/{key}/threads/{root_id}:
    parameters:
      - $ref: "#/components/parameters/ConversationKey"
      - name: root_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [threads]
      summary: Get a channel root post and its thread replies
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: offline
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Thread view
          content:
            application/json:
              schema:
                type: object
                required: [thread]
                properties:
                  thread:
                    $ref: "#/components/schemas/ThreadView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /conversations/{key}/messages/{msg_id}/replies:
    parameters:
      - $ref: "#/components/parameters/ConversationKey"
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [messages, threads]
      summary: Reply to a channel thread or quote-reply a chat message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyRequest"
      responses:
        "200":
          description: Reply sent
          content:
            application/json:
              schema:
                type: object
                required: [ok, conversation, reply_to, message]
                properties:
                  ok:
                    type: boolean
                  conversation:
                    $ref: "#/components/schemas/ConversationSummary"
                  reply_to:
                    type: string
                  message:
                    $ref: "#/components/schemas/MessageItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /conversations/{key}/files:
    parameters:
      - $ref: "#/components/parameters/ConversationKey"
    post:
      tags: [files]
      summary: Upload a local file to OneDrive/SharePoint and post a reference attachment (or inline image)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendFileRequest"
      responses:
        "200":
          description: File uploaded and posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /conversations/{key}/messages/{msg_id}/attachments/download:
    parameters:
      - $ref: "#/components/parameters/ConversationKey"
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [files]
      summary: Download an attachment from a message
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadRequest"
      responses:
        "200":
          description: File downloaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /conversations/{key}/messages/{msg_id}/reactions:
    parameters:
      - $ref: "#/components/parameters/ConversationKey"
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [messages]
      summary: Set or unset a reaction on a message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionRequest"
      responses:
        "200":
          description: Reaction updated
          content:
            application/json:
              schema:
                type: object
                required: [ok, conv_key, msg_id, reaction, enable]
                properties:
                  ok:
                    type: boolean
                  conv_key:
                    type: string
                  msg_id:
                    type: string
                  reaction:
                    type: string
                  enable:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /conversations/{key}/messages/{msg_id}:
    parameters:
      - $ref: "#/components/parameters/ConversationKey"
      - $ref: "#/components/parameters/MessageId"
    patch:
      tags: [messages]
      summary: Edit a message sent by the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditMessageRequest"
      responses:
        "200":
          description: Message edited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageMutationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [messages]
      summary: Soft-delete a message sent by the authenticated user
      parameters:
        - name: thread_root_id
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                thread_root_id:
                  type: [string, "null"]
      responses:
        "200":
          description: Message deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageMutationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /conversations/{key}/read:
    parameters:
      - $ref: "#/components/parameters/ConversationKey"
    post:
      tags: [conversations]
      summary: Mark a conversation as read
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                type: object
                required: [ok, conv_key]
                properties:
                  ok:
                    type: boolean
                  conv_key:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /conversations/{key}/members:
    parameters:
      - $ref: "#/components/parameters/ConversationKey"
    get:
      tags: [conversations]
      summary: List members of a chat or channel
      responses:
        "200":
          description: Member list
          content:
            application/json:
              schema:
                type: object
                required: [conv_key, title, members]
                properties:
                  conv_key:
                    type: string
                  title:
                    type: string
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemberInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /search:
    get:
      tags: [search]
      summary: Search cached messages via SQLite FTS5
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/Limit"
        - name: target
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Search hits
          content:
            application/json:
              schema:
                type: object
                required: [query, hits]
                properties:
                  query:
                    type: string
                  hits:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchHit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /presence:
    get:
      tags: [presence]
      summary: Get presence for self or specified user IDs
      parameters:
        - name: user_ids
          in: query
          required: false
          description: Comma-separated Entra user IDs. Omit for current user presence.
          schema:
            type: string
      responses:
        "200":
          description: Presence response
          content:
            application/json:
              schema:
                type: object
                properties:
                  presence:
                    $ref: "#/components/schemas/PresenceStatus"
                  presences:
                    type: array
                    items:
                      $ref: "#/components/schemas/PresenceStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [presence]
      summary: Set preferred presence for current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPresenceRequest"
      responses:
        "200":
          description: Presence updated
          content:
            application/json:
              schema:
                type: object
                required: [ok, availability, activity]
                properties:
                  ok:
                    type: boolean
                  availability:
                    type: string
                  activity:
                    type: string
                  expiration_mins:
                    type: [integer, "null"]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /mail/folders:
    get:
      tags: [mail]
      summary: List Outlook mail folders
      parameters:
        - name: refresh
          in: query
          schema:
            type: boolean
            default: false
        - name: offline
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Mail folders
          content:
            application/json:
              schema:
                type: object
                required: [folders]
                properties:
                  folders:
                    type: array
                    items:
                      $ref: "#/components/schemas/MailFolder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /mail/messages:
    get:
      tags: [mail]
      summary: List Outlook mail messages in a folder
      parameters:
        - name: folder
          in: query
          schema:
            type: string
            default: inbox
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 30
        - name: unread
          in: query
          schema:
            type: boolean
            default: false
        - name: refresh
          in: query
          schema:
            type: boolean
            default: false
        - name: offline
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Mail message list
          content:
            application/json:
              schema:
                type: object
                required: [folder, messages]
                properties:
                  folder:
                    type: string
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/MailMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /mail/messages/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [mail]
      summary: Get an Outlook mail message by ID
      parameters:
        - name: offline
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Mail message details
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    $ref: "#/components/schemas/MailMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [mail]
      summary: Update read or flagged status on a mail message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_read:
                  type: [boolean, "null"]
                flagged:
                  type: [boolean, "null"]
      responses:
        "200":
          description: Updated state
          content:
            application/json:
              schema:
                type: object
                required: [ok, message_id]
                properties:
                  ok:
                    type: boolean
                  message_id:
                    type: string
                  is_read:
                    type: [boolean, "null"]
                  flagged:
                    type: [boolean, "null"]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [mail]
      summary: Delete a mail message
      responses:
        "200":
          description: Mail deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok, message_id]
                properties:
                  ok:
                    type: boolean
                  message_id:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /mail/send:
    post:
      tags: [mail]
      summary: Send a new Outlook email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMailRequest"
      responses:
        "200":
          description: Mail sent
          content:
            application/json:
              schema:
                type: object
                required: [ok, to, subject]
                properties:
                  ok:
                    type: boolean
                  to:
                    type: array
                    items:
                      type: string
                  subject:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /mail/messages/{id}/reply:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [mail]
      summary: Reply or reply-all to a mail message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [markdown]
              properties:
                markdown:
                  type: string
                  minLength: 1
                reply_all:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Reply sent
          content:
            application/json:
              schema:
                type: object
                required: [ok, message_id, reply_all]
                properties:
                  ok:
                    type: boolean
                  message_id:
                    type: string
                  reply_all:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /mail/messages/{id}/forward:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [mail]
      summary: Forward a mail message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: array
                  items:
                    type: string
                  minItems: 1
                markdown:
                  type: string
                  default: ""
      responses:
        "200":
          description: Forward sent
          content:
            application/json:
              schema:
                type: object
                required: [ok, message_id, to]
                properties:
                  ok:
                    type: boolean
                  message_id:
                    type: string
                  to:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /mail/messages/{id}/move:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [mail]
      summary: Move a mail message to another folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination_folder]
              properties:
                destination_folder:
                  type: string
      responses:
        "200":
          description: Mail moved
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok:
                    type: boolean
                  message:
                    $ref: "#/components/schemas/MailMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /mail/messages/{id}/attachments/{att_id}/download:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: att_id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [mail]
      summary: Download a mail attachment to local disk
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                out_dir:
                  type: [string, "null"]
      responses:
        "200":
          description: Attachment saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /mail/search:
    get:
      tags: [mail]
      summary: Search cached mail via FTS5 and optionally Graph $search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: folder
          in: query
          schema:
            type: string
        - name: remote
          in: query
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 30
      responses:
        "200":
          description: Mail search results
          content:
            application/json:
              schema:
                type: object
                required: [query, hits, remote]
                properties:
                  query:
                    type: string
                  hits:
                    type: array
                    items:
                      $ref: "#/components/schemas/MailSearchHit"
                  remote:
                    type: array
                    items:
                      $ref: "#/components/schemas/MailMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /calendar/events:
    get:
      tags: [calendar]
      summary: List calendar events in a time window
      parameters:
        - name: start
          in: query
          schema:
            type: string
