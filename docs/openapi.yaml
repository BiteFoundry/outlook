        "500":
          $ref: "#/components/responses/InternalError"
  /todo/lists/{list_id}/tasks/{task_id}:
    parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
      - name: task_id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [todo]
      summary: Mark a To Do task completed or incomplete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                completed:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                type: object
                required: [ok, task]
                properties:
                  ok:
                    type: boolean
                  task:
                    $ref: "#/components/schemas/TodoTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [todo]
      summary: Delete a To Do task
      responses:
        "200":
          description: Task deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok, list_id, task_id]
                properties:
                  ok:
                    type: boolean
                  list_id:
                    type: string
                  task_id:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Required when `teams serve --token <secret>` is set.
  parameters:
    ConversationKey:
      name: key
      in: path
      required: true
      description: URL-encoded `conv_key`, raw `chat_id`, `"Team/Channel"`, or fuzzy conversation title.
      schema:
        type: string
    MessageId:
      name: msg_id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 50
  responses:
    BadRequest:
      description: Invalid parameters or malformed JSON body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Target conversation or cached thread not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Upstream Graph or SQLite error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthResponse:
      type: object
      required: [ok, version]
      properties:
        ok:
          type: boolean
        user_id:
          type: [string, "null"]
        version:
          type: string
    ConversationTarget:
      type: object
      required: [target_type]
      properties:
        target_type:
          type: string
          enum: [chat, channel]
        chat_id:
          type: string
        team_id:
          type: string
        channel_id:
          type: string
    ConversationSummary:
      type: object
      required: [conv_key, target, kind, title, unread_count, pinned]
      properties:
        conv_key:
          type: string
        target:
          $ref: "#/components/schemas/ConversationTarget"
        kind:
          type: string
          enum: [oneOnOne, group, meeting, channel]
        team_id:
          type: [string, "null"]
        team_name:
          type: [string, "null"]
        title:
          type: string
        topic:
          type: [string, "null"]
        unread_count:
          type: integer
        last_read_at:
          type: [string, "null"]
        last_msg_id:
          type: [string, "null"]
        last_msg_author:
          type: [string, "null"]
        last_msg_preview:
          type: [string, "null"]
        last_updated_at:
          type: [string, "null"]
        pinned:
          type: boolean
        peer_user_id:
          type: [string, "null"]
        web_url:
          type: [string, "null"]
    ChannelSummary:
      type: object
      required: [id, team_id, team_name, display_name, membership_type]
      properties:
        id:
          type: string
        team_id:
          type: string
        team_name:
          type: string
        display_name:
          type: string
        description:
          type: [string, "null"]
        membership_type:
          type: string
        web_url:
          type: [string, "null"]
    TeamSummary:
      type: object
      required: [id, display_name, channels]
      properties:
        id:
          type: string
        display_name:
          type: string
        description:
          type: [string, "null"]
        channels:
          type: array
          items:
            $ref: "#/components/schemas/ChannelSummary"
    AttachmentInfo:
      type: object
      required: [id, content_type]
      properties:
        id:
          type: string
        content_type:
          type: string
        content_url:
          type: [string, "null"]
        name:
          type: [string, "null"]
        content_json:
          type: [string, "null"]
        thumbnail_url:
          type: [string, "null"]
    MentionInfo:
      type: object
      required: [id, user_id, display_name]
      properties:
        id:
          type: integer
        user_id:
          type: string
        display_name:
          type: string
    ReactionSummary:
      type: object
      required: [reaction_type, count, me_reacted, users]
      properties:
        reaction_type:
          type: string
        count:
          type: integer
        me_reacted:
          type: boolean
        users:
          type: array
          items:
            type: string
    MessageItem:
      type: object
      required:
        [msg_key, conv_key, msg_id, author_name, is_me, created_at, deleted, importance, message_type, body_html, body_plain, attachments, mentions, reactions, reply_count]
      properties:
        msg_key:
          type: string
        conv_key:
          type: string
        msg_id:
          type: string
        parent_msg_id:
          type: [string, "null"]
        reply_to_id:
          type: [string, "null"]
        reply_to_author:
          type: [string, "null"]
        reply_to_preview:
          type: [string, "null"]
        subject:
          type: [string, "null"]
        author_id:
          type: [string, "null"]
        author_name:
          type: string
        is_me:
          type: boolean
        created_at:
          type: string
        last_modified_at:
          type: [string, "null"]
        deleted:
          type: boolean
        importance:
          type: string
        message_type:
          type: string
        body_html:
          type: string
        body_plain:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentInfo"
        mentions:
          type: array
          items:
            $ref: "#/components/schemas/MentionInfo"
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/ReactionSummary"
        reply_count:
          type: integer
        web_url:
          type: [string, "null"]
    ThreadView:
      type: object
      required: [conv_key, root, replies]
      properties:
        conv_key:
          type: string
        root:
          $ref: "#/components/schemas/MessageItem"
        replies:
          type: array
          items:
            $ref: "#/components/schemas/MessageItem"
    PresenceStatus:
      type: object
      required: [user_id, availability, activity]
      properties:
        user_id:
          type: string
        availability:
          type: string
        activity:
          type: string
    MemberInfo:
      type: object
      required: [user_id, display_name, roles]
      properties:
        user_id:
          type: string
        member_id:
          type: [string, "null"]
        display_name:
          type: string
        email:
          type: [string, "null"]
        roles:
          type: array
          items:
            type: string
        presence:
          oneOf:
            - $ref: "#/components/schemas/PresenceStatus"
            - type: "null"
    SearchHit:
      type: object
      required: [conv_key, conv_title, kind, msg_id, author_name, created_at, snippet]
      properties:
        conv_key:
          type: string
        conv_title:
          type: string
        kind:
          type: string
          enum: [oneOnOne, group, meeting, channel]
        msg_id:
          type: string
        parent_msg_id:
          type: [string, "null"]
        author_name:
          type: string
        created_at:
          type: string
        snippet:
          type: string
    CreateChatRequest:
      type: object
      required: [members]
      properties:
        members:
          type: array
          minItems: 1
          items:
            type: string
        topic:
          type: [string, "null"]
    MentionInput:
      oneOf:
        - type: string
          description: Format `user_id:DisplayName`
        - type: object
          required: [user_id, display_name]
          properties:
            id:
              type: [integer, "null"]
            user_id:
              type: string
            display_name:
              type: string
    SendMessageRequest:
      type: object
      required: [markdown]
      properties:
        markdown:
          type: string
          minLength: 1
        subject:
          type: [string, "null"]
        mentions:
          type: array
          items:
            $ref: "#/components/schemas/MentionInput"
        important:
          type: boolean
          default: false
    SendMessageResult:
      type: object
      required: [ok, conversation, message]
      properties:
        ok:
          type: boolean
        conversation:
          $ref: "#/components/schemas/ConversationSummary"
        message:
          $ref: "#/components/schemas/MessageItem"
    ReplyRequest:
      type: object
      required: [markdown]
      properties:
        markdown:
          type: string
          minLength: 1
        mentions:
          type: array
          items:
            $ref: "#/components/schemas/MentionInput"
        important:
          type: boolean
          default: false
    SendFileRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
        caption:
          type: [string, "null"]
        thread_root_id:
          type: [string, "null"]
        inline:
          type: boolean
          default: false
    DownloadRequest:
      type: object
      properties:
        index:
          type: integer
          minimum: 0
          default: 0
        out_dir:
          type: [string, "null"]
        thread_root_id:
          type: [string, "null"]
    DownloadResult:
      type: object
      required: [ok, path, file_name, bytes_written]
      properties:
        ok:
          type: boolean
        path:
          type: string
        file_name:
          type: string
        bytes_written:
          type: integer
    ReactionRequest:
      type: object
      required: [reaction]
      properties:
        reaction:
          type: string
          description: "`like`, `heart`, `laugh`, `surprised`, `sad`, `angry`, or unicode emoji"
        enable:
          type: boolean
          default: true
        thread_root_id:
          type: [string, "null"]
    EditMessageRequest:
      type: object
      required: [markdown]
      properties:
        markdown:
          type: string
          minLength: 1
        thread_root_id:
          type: [string, "null"]
    MessageMutationResult:
      type: object
      required: [ok, conv_key, msg_id]
      properties:
        ok:
          type: boolean
        conv_key:
          type: string
        msg_id:
          type: string
    SetPresenceRequest:
      type: object
      required: [availability]
      properties:
        availability:
          type: string
          enum: [Available, Busy, DoNotDisturb, BeRightBack, Away, Reset]
        activity:
          type: [string, "null"]
        expiration_mins:
          type: [integer, "null"]
          minimum: 1
          maximum: 1440
    EmailRecipient:
      type: object
      required: [address]
      properties:
        name:
          type: [string, "null"]
        address:
          type: string
    MailFolder:
      type: object
      required: [id, display_name, unread_item_count, total_item_count]
      properties:
        id:
          type: string
        display_name:
          type: string
        well_known_name:
          type: [string, "null"]
        parent_folder_id:
          type: [string, "null"]
        unread_item_count:
          type: integer
        total_item_count:
          type: integer
    MailAttachment:
      type: object
      required: [id, name, content_type, size, is_inline]
      properties:
        id:
          type: string
        name:
          type: string
        content_type:
          type: string
        size:
          type: integer
        is_inline:
          type: boolean
        content_id:
          type: [string, "null"]
        content_bytes_b64:
          type: [string, "null"]
    MailMessage:
      type: object
      required: [id, subject, to_recipients, cc_recipients, bcc_recipients, received_at, is_read, is_draft, flagged, importance, has_attachments, preview, body_html, body_plain, attachments]
      properties:
        id:
          type: string
        conversation_id:
          type: [string, "null"]
        folder_id:
          type: [string, "null"]
        subject:
          type: string
        from:
          anyOf:
            - $ref: "#/components/schemas/EmailRecipient"
            - type: "null"
        to_recipients:
          type: array
          items:
            $ref: "#/components/schemas/EmailRecipient"
        cc_recipients:
          type: array
          items:
            $ref: "#/components/schemas/EmailRecipient"
        bcc_recipients:
          type: array
          items:
            $ref: "#/components/schemas/EmailRecipient"
        received_at:
          type: string
        sent_at:
          type: [string, "null"]
        is_read:
          type: boolean
        is_draft:
          type: boolean
        flagged:
          type: boolean
        importance:
          type: string
        has_attachments:
          type: boolean
        preview:
          type: string
        body_html:
          type: string
        body_plain:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/MailAttachment"
        web_link:
          type: [string, "null"]
    MailSearchHit:
      type: object
      required: [id, subject, from_display, received_at, snippet, has_attachments, is_read]
      properties:
        id:
          type: string
        folder_id:
          type: [string, "null"]
        subject:
          type: string
        from_display:
          type: string
        received_at:
          type: string
        snippet:
          type: string
        has_attachments:
          type: boolean
        is_read:
          type: boolean
    SendMailRequest:
      type: object
      required: [to, subject, markdown]
      properties:
        to:
          type: array
          items:
            type: string
          minItems: 1
        cc:
          type: array
          items:
            type: string
        bcc:
          type: array
          items:
            type: string
        subject:
          type: string
        markdown:
          type: string
        attachments:
          type: array
          items:
            type: string
        important:
          type: boolean
          default: false
    EventAttendee:
      type: object
      required: [address, attendee_type, response_status]
      properties:
        name:
          type: [string, "null"]
        address:
          type: string
        attendee_type:
          type: string
        response_status:
          type: string
    CalendarEvent:
      type: object
      required: [id, subject, start_iso, end_iso, time_zone, is_all_day, attendees, response_status, is_online_meeting, body_html, body_plain, is_cancelled]
      properties:
        id:
          type: string
        subject:
          type: string
        start_iso:
          type: string
        end_iso:
          type: string
        time_zone:
          type: string
        is_all_day:
          type: boolean
        location:
          type: [string, "null"]
        organizer_name:
          type: [string, "null"]
        organizer_email:
          type: [string, "null"]
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/EventAttendee"
        response_status:
          type: string
        is_online_meeting:
          type: boolean
        online_meeting_url:
          type: [string, "null"]
        body_html:
          type: string
        body_plain:
          type: string
        is_cancelled:
          type: boolean
        web_link:
          type: [string, "null"]
    CreateCalendarEventRequest:
      type: object
      required: [subject, start_iso, end_iso]
      properties:
