        personal notebook. Also served at `POST /onenote/notebooks`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOnenoteNotebookRequest"
      responses:
        "200":
          description: Notebook created
          content:
            application/json:
              schema:
                type: object
                required: [ok, notebook]
                properties:
                  ok:
                    type: boolean
                  notebook:
                    $ref: "#/components/schemas/OnenoteNotebook"
