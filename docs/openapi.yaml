openapi: 3.1.0
info:
  title: outlook-cli local HTTP API (Mail · Calendar · To Do · Contacts)
  version: 0.1.0
  description: |
    Local HTTP/JSON contract exposed by `outlook serve` (alias `api`).

    Backed by Microsoft Graph v1.0, local SQLite WAL/FTS5 caching, and the
    background sync engine. Binds to `127.0.0.1:3939` by default (non-loopback
    binds require `--api-key <KEY>` / `--token <KEY>` or
    `OUTLOOK_ALLOW_INSECURE_SERVE=1`). When an API key is configured, every
    endpoint except `GET /health` requires `Authorization: Bearer <key>` or
    `x-api-key: <key>`.

    All errors return `{"error": "<message>"}` with an appropriate HTTP status.
servers:
  - url: http://127.0.0.1:3939
    description: Default loopback listener
security:
  - bearerAuth: []
  - apiKeyHeader: []
  - {}
tags:
  - name: system
  - name: mail
  - name: calendar
  - name: todo
  - name: contacts
paths:
  /health:
    get:
      tags: [system]
      summary: Health check (public)
      description: Always public, even when `--api-key` is set.
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /openapi.json:
    get:
      tags: [system]
      summary: OpenAPI 3.1 specification
      responses:
        "200":
          description: OpenAPI 3.1.0 JSON document
  /v1/whoami:
    get:
      tags: [system]
      summary: Current user profile, auth source, and token status
      responses:
        "200":
          description: User identity and token diagnostics
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/mail/folders:
    get:
      tags: [mail]
      summary: List Outlook mail folders
      parameters:
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: offline
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Mail folders list
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/mail/messages:
    get:
      tags: [mail]
      summary: List messages in a folder
      parameters:
        - name: folder
          in: query
          required: false
          schema:
            type: string
            default: inbox
        - $ref: "#/components/parameters/Limit"
        - name: unread
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: flagged
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: focused
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: offline
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Folder metadata and matching messages
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/mail/messages/{id}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [mail]
      summary: Read a mail message
      parameters:
        - name: offline
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Full mail message with body and attachment metadata
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [mail]
      summary: Update (read/flag/move) a mail message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMailRequest"
      responses:
        "200":
          description: Message updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [mail]
      summary: Delete a mail message
      responses:
        "200":
          description: Message deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/mail/send:
    post:
      tags: [mail]
      summary: Send a new email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMailRequest"
      responses:
        "200":
          description: Email sent
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/mail/messages/{id}/reply:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [mail]
      summary: Reply to a mail message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyMailRequest"
      responses:
        "200":
          description: Reply sent
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/mail/messages/{id}/forward:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [mail]
      summary: Forward a mail message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwardMailRequest"
      responses:
        "200":
          description: Forward sent
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/mail/messages/{id}/attachments/{att_id}/download:
    parameters:
      - $ref: "#/components/parameters/ItemId"
      - name: att_id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [mail]
      summary: Download a mail attachment to disk
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                out_dir:
                  type: string
      responses:
        "200":
          description: Attachment saved
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/mail/search:
    get:
      tags: [mail]
      summary: Search mail messages locally (SQLite FTS5) or remotely (Graph KQL)
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: folder
          in: query
          required: false
          schema:
            type: string
        - name: remote
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Local search hits and optional remote Graph matches
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/calendar/events:
    get:
      tags: [calendar]
      summary: List calendar events
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: false
          schema:
            type: string
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 7
        - $ref: "#/components/parameters/Limit"
        - name: offline
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Calendar events in the requested window
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [calendar]
      summary: Create a new calendar event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCalendarEventRequest"
      responses:
        "200":
          description: Event created
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/calendar/events/{id}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      tags: [calendar]
      summary: Read a calendar event
      parameters:
        - name: offline
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Event details
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [calendar]
      summary: Delete a calendar event
      responses:
        "200":
          description: Event deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/calendar/events/{id}/rsvp:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      tags: [calendar]
      summary: Respond (accept/tentative/decline) to a calendar event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response:
                  type: string
                  enum: [accept, tentative, decline]
                comment:
                  type: string
      responses:
        "200":
          description: RSVP recorded
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/todo/lists:
    get:
      tags: [todo]
      summary: List Microsoft To Do task lists
      parameters:
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: offline
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: To Do task lists
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/todo/tasks:
    get:
      tags: [todo]
      summary: List To Do tasks
      parameters:
        - name: list
          in: query
          required: false
          schema:
            type: string
            default: tasks
        - name: all
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Limit"
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: offline
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: To Do tasks
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [todo]
      summary: Create a To Do task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTodoTaskRequest"
      responses:
        "200":
          description: Task created
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/todo/tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    patch:
      tags: [todo]
      summary: Complete or reopen a To Do task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completed]
              properties:
                list:
                  type: string
                completed:
                  type: boolean
      responses:
        "200":
          description: Task updated
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [todo]
      summary: Delete a To Do task
      parameters:
        - name: list
          in: query
          required: false
          schema:
            type: string
            default: tasks
      responses:
        "200":
          description: Task deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/contacts:
    get:
      tags: [contacts]
      summary: List or search Outlook contacts and Entra directory
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - name: offline
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Contacts list
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
  parameters:
    ItemId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Microsoft Graph 403 Forbidden (missing delegated scopes)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Server or upstream Graph error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthResponse:
      type: object
      required: [ok, version]
      properties:
        ok:
          type: boolean
        user_id:
          type: [string, "null"]
        version:
          type: string
    SendMailRequest:
      type: object
      required: [to, subject, markdown]
      properties:
        to:
          type: array
          items:
            type: string
        cc:
          type: array
          items:
            type: string
        bcc:
          type: array
          items:
            type: string
        subject:
          type: string
        markdown:
          type: string
        importance:
          type: string
          enum: [low, normal, high]
        attachments:
          type: array
          items:
            type: string
        save_to_sent_items:
          type: boolean
          default: true
    ReplyMailRequest:
      type: object
      required: [markdown]
      properties:
        markdown:
          type: string
        reply_all:
          type: boolean
          default: false
    ForwardMailRequest:
      type: object
      required: [to]
      properties:
        to:
          type: array
          items:
            type: string
        markdown:
          type: string
    PatchMailRequest:
      type: object
      properties:
        is_read:
          type: boolean
        flagged:
          type: boolean
        destination_folder_id:
          type: string
    CreateCalendarEventRequest:
      type: object
      required: [subject, start_iso, end_iso]
      properties:
        subject:
          type: string
        start_iso:
          type: string
          description: RFC3339 instant, wall clock "YYYY-MM-DD HH:MM" (machine zone, or time_zone when given), or "YYYY-MM-DD" when is_all_day is true.
        end_iso:
          type: string
          description: Same form as start_iso. For all-day events the end date is exclusive.
        time_zone:
          type: string
          description: IANA or Windows time zone. Wall-clock values are read in this zone; RFC3339 values stay exact instants in UTC.
        is_all_day:
          type: boolean
          default: false
          description: All-day event. start_iso and end_iso must be YYYY-MM-DD.
        location:
          type: string
        markdown:
          type: string
        attendees:
          type: array
          items:
            type: string
        is_online_meeting:
          type: boolean
          default: false
    CreateTodoTaskRequest:
      type: object
      required: [title]
      properties:
        list:
          type: string
        title:
          type: string
        body_plain:
          type: string
        due_date_iso:
          type: string
        importance:
          type: string
          enum: [low, normal, high]
