  /v1/onenote/notebooks:
    get:
      tags: [onenote]
      summary: List personal and team/group OneNote notebooks
      description: |
        Personal (`/me/onenote`) notebooks plus notebooks shared through joined
        Teams / M365 groups. Also served at `/onenote/notebooks`.
      parameters:
        - name: include_teams
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: offline
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Notebook list
          content:
            application/json:
              schema:
                type: object
                required: [notebooks]
                properties:
                  notebooks:
                    type: array
                    items:
                      $ref: "#/components/schemas/OnenoteNotebook"
