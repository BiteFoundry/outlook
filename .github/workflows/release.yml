name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            package: teams-win32-x64
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            package: teams-win32-arm64
            archive: zip
          - target: x86_64-apple-darwin
            os: macos-15-intel
            package: teams-darwin-x64
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            package: teams-darwin-arm64
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            package: teams-linux-x64
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            package: teams-linux-arm64
            archive: tar.gz

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux ARM64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          {
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary into npm package
        run: node scripts/build-npm.mjs --target ${{ matrix.target }}

      - name: Create release archive
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          name="teams-${version}-${{ matrix.target }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "${name}.zip" "target/${{ matrix.target }}/release/teams.exe"
          else
            tar -czf "${name}.tar.gz" -C "target/${{ matrix.target }}/release" teams
          fi

      - name: Stage npm artifact directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          cp -R "npm/${{ matrix.package }}" staging/

      - name: Upload npm platform package
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.target }}
          path: staging
          if-no-files-found: error

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: teams-*-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    name: publish npm packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download npm packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: npm-*
          merge-multiple: true

      - name: Verify packages
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")

          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version v${version}" >&2
            exit 1
          fi

          node scripts/sync-version.mjs --check

          for package in teams-win32-x64 teams-win32-arm64 teams-darwin-x64 \
                         teams-darwin-arm64 teams-linux-x64 teams-linux-arm64; do
            if [ ! -f "dist/${package}/package.json" ]; then
              echo "missing dist/${package}/package.json" >&2
              exit 1
            fi
            if [ ! -d "dist/${package}/bin" ]; then
              echo "missing dist/${package}/bin" >&2
              exit 1
            fi
            actual=$(node -p "require('./dist/${package}/package.json').version")
            if [ "${actual}" != "${version}" ]; then
              echo "${package} version ${actual} != ${version}" >&2
              exit 1
            fi
          done

          test -f dist/teams-win32-x64/bin/teams.exe
          test -f dist/teams-win32-arm64/bin/teams.exe
          test -f dist/teams-darwin-x64/bin/teams
          test -f dist/teams-darwin-arm64/bin/teams
          test -f dist/teams-linux-x64/bin/teams
          test -f dist/teams-linux-arm64/bin/teams

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for dir in dist/teams-*; do
            echo "publishing $(basename "${dir}")"
            npm publish "${dir}" --access public
          done

      - name: Publish root package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  release:
    name: create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: binary-*
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
